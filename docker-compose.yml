services:
  mcpserver:
    build:
      context: .
      dockerfile: dcArca.McpServer/Dockerfile
    image: dcarca-mcpserver:local
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - ${APPSETTINGS_PATH:-./dcArca.McpServer/appsettings.json}:/app/appsettings.json:ro
      - ${CERTIFICATE_PATH}:/certs/certificado.pfx:ro
    environment:
      Jwt__Authority: ${JWT_AUTHORITY}
      Jwt__Audience: ${JWT_AUDIENCE}

# Este compose es deliberadamente genérico: no configura proxy reverso, TLS,
# redes privadas ni infraestructura de producción. El host debe aportar
# certificados, secretos y controles de red mediante variables/volúmenes.
